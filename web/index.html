<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNC Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }
        .header {
            height: 52px;
            background: #222;
            color: #fff;
            display: flex;
            align-items: flex-end;
            padding: 0 15px;
            position: relative;
        }
        .title {
            height: 52px;
            display: flex;
            align-items: center;
            padding-right: 25px;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }
        .tabs {
            height: 52px;
            display: flex;
            align-items: flex-end;
            flex-grow: 1;
        }
        .tab {
            height: 42px;
            min-width: 110px;
            padding: 0 24px;
            border: none;
            border-radius: 12px 12px 0 0;
            margin-right: 3px;
            background: #333;
            color: #ccc;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab:hover { background: #444; color: #fff; }
        .tab.active {
            height: 46px;
            background: #fff;
            color: #222;
        }
        /* Reload button area */
        .reload-area {
            height: 52px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            padding-left: 15px;
        }
        .reload-btn {
            height: 34px;
            padding: 0 14px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #eee;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .reload-btn:hover { background: #555; }
        .reload-btn:active { background: #666; }
        .reload-btn.danger { background: #662222; }
        .reload-btn.danger:hover { background: #883333; }

        .content {
            width: 100%;
            height: calc(100vh - 52px);
            background: #fff;
        }
        .panel {
            display: none;
            width: 100%;
            height: 100%;
        }
        .panel.active { display: block; }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Home styles unchanged */
        .home {
            width: 100%; height: 100%;
            overflow: auto; padding: 50px;
            background: linear-gradient(135deg, #f5f5f5, #fff);
            color: #222;
        }
        .home-container { max-width: 1000px; margin: 0 auto; }
        .home-title { font-size: 42px; font-weight: bold; margin-bottom: 10px; }
        .home-subtitle { font-size: 21px; color: #666; margin-bottom: 40px; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-bottom: 35px;
        }
        .card {
            padding: 24px; border-radius: 10px;
            background: #fff; border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-title { margin-bottom: 12px; font-size: 18px; font-weight: bold; }
        .card-text { color: #555; line-height: 1.5; }
        .status {
            display: inline-block; padding: 4px 10px;
            border-radius: 20px; background: #e8f5e9;
            color: #218838; font-size: 13px; font-weight: bold;
        }
        .description { max-width: 800px; font-size: 16px; line-height: 1.7; color: #444; }
        .footer {
            margin-top: 45px; padding-top: 20px;
            border-top: 1px solid #ddd; color: #777; font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">CNC Dashboard</div>
        <div class="tabs">
            <button class="tab active" onclick="showTab('home', this)">Home</button>
            <button class="tab" onclick="showTab('cam', this)">jsCUT</button>
            <button class="tab" onclick="showTab('kiri', this)">Kiri:moto</button>
            <button class="tab" onclick="showTab('cnc', this)">CNCjs</button>
            <button class="tab" onclick="showTab('files', this)">Files</button>
            <button class="tab" onclick="showTab('terminal', this)">Terminal</button>
        </div>

        <!-- Reload controls -->
        <div class="reload-area">
            <button class="reload-btn" onclick="reloadCurrent()" title="Reload the currently visible tab">
                ↻ Reload Current
            </button>
            <button class="reload-btn danger" onclick="reloadAll()" title="Hard-reload every iframe">
                ↻ Reload All
            </button>
        </div>
    </div>

    <div class="content">
        <div id="home" class="panel active">
            <!-- ... your existing home content stays exactly the same ... -->
            <div class="home">
                <div class="home-container">
                    <div class="home-title">CNC Dashboard</div>
                    <div class="home-subtitle">Web-based control and management interface for the CNC machine.</div>
                    <!-- ... rest of home cards unchanged ... -->
                </div>
            </div>
        </div>

        <div id="cam" class="panel">
            <iframe id="camFrame"
                    src="/jscut.html"
                    allow="fullscreen; clipboard-read; clipboard-write"
                    allowfullscreen></iframe>
        </div>

        <div id="kiri" class="panel">
            <iframe id="kiriFrame"
                    src="/kiri/"
                    allow="fullscreen; clipboard-read; clipboard-write"
                    allowfullscreen></iframe>
        </div>

        <div id="cnc" class="panel">
            <iframe id="cncFrame"></iframe>
        </div>

        <div id="files" class="panel">
            <iframe id="filesFrame"></iframe>
        </div>

        <div id="terminal" class="panel">
            <iframe id="terminalFrame" src="/terminal.html"></iframe>
        </div>
    </div>

    <script>
        const host = window.location.hostname;

        // Initial sources
        const frameSources = {
            cam:      "/jscut.html",
            kiri:     "/kiri/",
            cnc:      "http://" + host + ":8000",
            files:    "http://" + host + ":8088",
            terminal: "/terminal.html"
        };

        // Set initial src for dynamic ones
        document.getElementById("cncFrame").src   = frameSources.cnc;
        document.getElementById("filesFrame").src = frameSources.files;

        let currentTab = "home";

        function showTab(tabName, button) {
            document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.getElementById(tabName).classList.add("active");
            button.classList.add("active");
            currentTab = tabName;
        }

        // Hard reload a single iframe (cache-busting)
        function hardReload(iframeId) {
            const iframe = document.getElementById(iframeId);
            if (!iframe) return;

            const key = iframeId.replace("Frame", "");
            let src = frameSources[key] || iframe.src;

            // Cache-busting timestamp
            const separator = src.includes("?") ? "&" : "?";
            iframe.src = src + separator + "_t=" + Date.now();
        }

        // Reload only the currently visible tab
        function reloadCurrent() {
            if (currentTab === "home") {
                // Home has no iframe – just a visual feedback
                alert("Home page has no iframe to reload.");
                return;
            }
            hardReload(currentTab + "Frame");
        }

        // Hard-reload every iframe
        function reloadAll() {
            hardReload("camFrame");
            hardReload("kiriFrame");
            hardReload("cncFrame");
            hardReload("filesFrame");
            hardReload("terminalFrame");
        }

        // Optional: automatically hard-reload when switching to a tab
        // Uncomment the lines below if you want a clean workspace every time you click a tab
        /*
        const originalShowTab = showTab;
        showTab = function(tabName, button) {
            originalShowTab(tabName, button);
            if (tabName !== "home") {
                hardReload(tabName + "Frame");
            }
        };
        */
    </script>
</body>
</html>
